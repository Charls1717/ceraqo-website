name: asset-bridge

# Transfers media between Higgsfield storage and this repo. The Claude session
# container has restricted egress, so a GitHub runner does the byte moving:
#   downloads: [{"url": "https://...", "path": "bridge/out/clip1.mp4"}]
#   uploads:   [{"file": "bridge/up/frame.jpg", "put_url": "https://...", "content_type": "image/jpeg"}]
# Downloaded files are committed back to the same branch.

on:
  workflow_dispatch:
    inputs:
      downloads:
        description: 'JSON array of {url, path} to fetch and commit'
        required: false
        default: '[]'
      uploads:
        description: 'JSON array of {file, put_url, content_type} to PUT from the repo'
        required: false
        default: '[]'
      deploy_pages:
        description: 'Set "true" to build and deploy the site to GitHub Pages'
        required: false
        default: 'false'
      base_path:
        description: 'Vite base path for the Pages build'
        required: false
        default: '/ceraqo-website/'

permissions:
  contents: write

concurrency:
  group: asset-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Optional Pages deployment (dispatch with deploy_pages=true). Lives here
  # rather than in deploy-pages.yml because workflow_dispatch only registers
  # workflows present on the repo's default branch.
  pages:
    if: ${{ inputs.deploy_pages == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --base "${{ inputs.base_path || '/' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  bridge:
    if: ${{ inputs.deploy_pages != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files to presigned URLs
        env:
          UPLOADS: ${{ inputs.uploads }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          items = json.loads(os.environ["UPLOADS"] or "[]")
          for it in items:
              print("PUT", it["file"], flush=True)
              subprocess.run([
                  "curl", "-sS", "--fail", "--retry", "3", "--retry-delay", "2",
                  "-X", "PUT",
                  "-H", "Content-Type: " + it.get("content_type", "application/octet-stream"),
                  "--data-binary", "@" + it["file"],
                  it["put_url"],
              ], check=True)
          print("uploads done:", len(items))
          PY

      - name: Download files
        env:
          DOWNLOADS: ${{ inputs.downloads }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          items = json.loads(os.environ["DOWNLOADS"] or "[]")
          for it in items:
              d = os.path.dirname(it["path"])
              if d:
                  os.makedirs(d, exist_ok=True)
              print("GET ->", it["path"], flush=True)
              subprocess.run([
                  "curl", "-sSL", "--fail", "--retry", "3", "--retry-delay", "2",
                  "-o", it["path"], it["url"],
              ], check=True)
              print(it["path"], os.path.getsize(it["path"]), "bytes")
          print("downloads done:", len(items))
          PY

      - name: Commit downloaded files
        run: |
          git config user.name "asset-bridge"
          git config user.email "asset-bridge@users.noreply.github.com"
          git add -A bridge/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "bridge: fetched assets"
            for i in 1 2 3; do
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi
