# Asset bridge: downloads generated media (Higgsfield CDN) on a runner with
# open egress and force-pushes it to a scratch branch this session can fetch.
# The scratch branch is disposable — it never merges into site branches.
#
# Trigger: commit a new .bridge/manifest.json (or use workflow_dispatch).
# Manifest shape:
#   { "branch": "higgsfield-assets",
#     "items": [{ "url": "https://…", "out": "file.png" }, …],
#     "put": { "url": "https://presigned…", "file": "frame.png" } }   # optional
name: asset-bridge

on:
  push:
    paths:
      - ".bridge/manifest.json"
  workflow_dispatch:
    inputs:
      manifest:
        description: "JSON object matching .bridge/manifest.json shape"
        required: true

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve manifest
        env:
          DISPATCH_MANIFEST: ${{ inputs.manifest }}
        run: |
          if [ -n "$DISPATCH_MANIFEST" ]; then
            echo "$DISPATCH_MANIFEST" > /tmp/manifest.json
          else
            cp .bridge/manifest.json /tmp/manifest.json
          fi
          jq . /tmp/manifest.json

      - name: Download manifest items
        run: |
          mkdir -p /tmp/out
          jq -c '.items[]' /tmp/manifest.json | while read -r item; do
            url=$(echo "$item" | jq -r '.url')
            name=$(echo "$item" | jq -r '.out')
            echo "fetching $name"
            curl -fSL --retry 3 --retry-delay 2 -o "/tmp/out/$name" "$url"
          done
          ls -la /tmp/out/

      - name: Optional presigned PUT
        run: |
          put_url=$(jq -r '.put.url // empty' /tmp/manifest.json)
          put_file=$(jq -r '.put.file // empty' /tmp/manifest.json)
          if [ -n "$put_url" ] && [ -n "$put_file" ]; then
            curl -fSL -X PUT --upload-file "/tmp/out/$put_file" "$put_url"
          fi

      - name: Force-push to scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(jq -r '.branch // "higgsfield-assets"' /tmp/manifest.json)
          cd /tmp/out
          git init -b "$branch"
          git config user.email "actions@users.noreply.github.com"
          git config user.name "asset-bridge"
          git add -A
          git commit -m "asset drop $(date -u +%Y%m%dT%H%M%SZ)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
